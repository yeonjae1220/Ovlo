<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body}, '정착 제휴', 'partners')}"
      lang="ko">
<body>

<div class="section-header">
  <span class="section-title">
    정착 제휴
    <span class="text-muted" style="font-size:13px; font-weight:400;"
          th:text="'(' + ${#lists.size(partners)} + '개)'"></span>
  </span>
</div>

<div class="card" style="margin-bottom:16px;">
  <div style="font-weight:600; margin-bottom:10px;">제휴 등록</div>
  <p class="text-muted" style="font-size:12px; margin:0 0 10px;">
    플랫폼 공통 링크입니다. 등록 직후에는 꺼져 있고, 켜도 각 국제처가 분류(유심·보험·숙소·픽업)를 켜야 학생에게 보입니다.
    학생 화면에는 항상 "제휴 · Ovlo가 수수료를 받을 수 있습니다" 표시가 붙고, 공지·자동 답변 안에는 들어가지 않습니다.
  </p>
  <form th:action="@{/admin/partners}" method="post" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <select name="category" required
            style="padding:6px 8px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);">
      <option value="SIM">유심</option>
      <option value="INSURANCE">보험</option>
      <option value="HOUSING">숙소</option>
      <option value="PICKUP">픽업</option>
    </select>
    <input type="text" name="name" placeholder="제휴사 이름" required maxlength="200"
           style="width:180px; padding:6px 8px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);"/>
    <input type="url" name="targetUrl" placeholder="https://..." required maxlength="1000"
           style="flex:1; min-width:240px; padding:6px 8px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);"/>
    <input type="text" name="description" placeholder="한 줄 설명 (선택)" maxlength="1000"
           style="flex:1; min-width:200px; padding:6px 8px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);"/>
    <input type="number" name="sortOrder" value="0" min="0" max="999" title="정렬"
           style="width:70px; padding:6px 8px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);"/>
    <button type="submit" class="btn btn-primary">등록</button>
  </form>
</div>

<div class="card" style="padding:0; overflow:hidden;">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>분류</th>
          <th>이름 / 링크</th>
          <th>정렬</th>
          <th>상태</th>
          <th>조치</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(partners)}">
          <td colspan="6" style="text-align:center; padding:32px; color:var(--text-muted);">등록된 제휴가 없습니다.</td>
        </tr>
        <tr th:each="p : ${partners}">
          <td style="color:var(--text-muted);" th:text="${p.id()}"></td>
          <td th:text="${p.category().name()}"></td>
          <td>
            <div style="font-weight:500;" th:text="${p.name()}"></div>
            <div class="text-muted" style="font-size:12px;">
              <a th:href="${p.targetUrl()}" th:text="${p.targetUrl()}" target="_blank" rel="noopener noreferrer"></a>
            </div>
            <div class="text-muted" style="font-size:12px;" th:if="${p.description() != null}" th:text="${p.description()}"></div>
          </td>
          <td th:text="${p.sortOrder()}"></td>
          <td>
            <span th:class="${p.enabled()} ? 'badge badge-active' : 'badge badge-pending'"
                  th:text="${p.enabled()} ? '켜짐' : '꺼짐'"></span>
          </td>
          <td>
            <form th:if="${!p.enabled()}" th:action="@{/admin/partners/{id}/enable(id=${p.id()})}" method="post" style="display:inline; margin:0;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-primary">켜기</button>
            </form>
            <form th:if="${p.enabled()}" th:action="@{/admin/partners/{id}/disable(id=${p.id()})}" method="post" style="display:inline; margin:0;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-danger">끄기</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
