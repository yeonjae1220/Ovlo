name: CI/CD Deploy

on:
  push:
    branches:
      - main
    # 문서만 바뀐 커밋으로 운영 재배포가 도는 것을 막는다 (GLOBAL-PIT-074)
    # pull_request 에는 일부러 걸지 않는다 — 필수 체크 미리포트로 머지가 막힌다.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yeonjae1220/ovlo

concurrency:
  group: ovlo-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test data scripts
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Build and test with Gradle
        run: ./gradlew build --no-daemon

      # Includes reaction concurrency, marketplace, office/Redis, catalog/video,
      # privacy and restoration tests in one run; do not weaken individual assertions.
      - name: Full PostgreSQL and Redis integration regressions
        timeout-minutes: 15
        run: ./gradlew integrationTest --no-daemon

      - name: Upload notice retrieval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-retrieval-reports
          path: build/reports/retrieval/
          if-no-files-found: error

      - name: Upload integration regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-regression-reports
          path: |
            build/test-results/integrationTest/
            build/reports/audit/
            build/reports/service-journey/
          if-no-files-found: error

  frontend-check:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Test account cache isolation
        run: |
          node scripts/test-service-worker.cjs
          node scripts/test-return-path.cjs
          node scripts/test-apple-sign-in.cjs
          node scripts/test-chat-reconnect.cjs
          node scripts/test-calendar.cjs
          node scripts/test-report-evidence.cjs
          node scripts/test-auth-query-cache.cjs
          node scripts/test-auth-session-race.cjs
          node scripts/test-consultation-history.cjs
          node scripts/test-notice-applicability.cjs
        working-directory: frontend
      - name: Test long notice warning
        run: node scripts/test-notice-length.cjs
        working-directory: frontend
      - name: Test university video links
        run: |
          node scripts/test-video-links.cjs
          node scripts/test-exchange-detail-videos.cjs
        working-directory: frontend
      - name: Test legal notices
        run: node scripts/test-legal-notice.cjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  build-and-push:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-check]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew bootJar --no-daemon

      - name: Get short SHA for image tag
        id: sha
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-frontend:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-check]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get short SHA for image tag
        id: sha
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_CLIENT_ID=${{ vars.APPLE_SERVICES_ID }}

  deploy:
    name: Deploy to Lenovo Server
    # self-hosted runner가 lenovo에서 직접 실행 — SSH 불필요
    runs-on: [self-hosted, homelab]
    needs: [build-and-push, build-and-push-frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Reconcile routing before replacing pods, including bounded upstream connects.
      - name: Apply network and ingress policies
        shell: bash
        run: |
          set -euo pipefail
          for manifest in k8s/network-policy.yaml k8s/ingress.yaml; do
            rc=0
            sudo kubectl diff -f "$manifest" -n ovlo || rc=$?
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
            sudo kubectl apply -f "$manifest" -n ovlo
          done

      # 국제처 파일럿(S6): prod 는 OfficePilotConfigGuard 가 anthropic 키를 요구한다.
      # 키가 없는데 저하 운영 허용(repo variable OVLO_OFFICE_ALLOW_DEGRADED=true)도 아니면
      # 새 파드가 기동 검사에서 죽어 롤아웃이 300s 뒤 실패한다 — 클러스터를 건드리기 전에 여기서 막는다.
      - name: Preflight office pilot config
        env:
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          OVLO_OFFICE_ALLOW_DEGRADED: ${{ vars.OVLO_OFFICE_ALLOW_DEGRADED }}
        run: |
          if [ "${HAS_ANTHROPIC_KEY}" != "true" ] && [ "${OVLO_OFFICE_ALLOW_DEGRADED}" != "true" ]; then
            echo "::error::GitHub secret ANTHROPIC_API_KEY 가 비어 있다. 키를 넣거나 repo variable OVLO_OFFICE_ALLOW_DEGRADED=true 로 저하 운영을 명시하라 (docs/intl-office-pilot-runbook.md §2)."
            exit 1
          fi
          echo "office pilot: anthropic key=${HAS_ANTHROPIC_KEY}, allow-degraded=${OVLO_OFFICE_ALLOW_DEGRADED:-false}"

      - name: Apply k8s secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_BCRYPT: ${{ secrets.ADMIN_PASSWORD_BCRYPT }}
          ADMIN_ADDITIONAL_ACCOUNTS: ${{ secrets.ADMIN_ADDITIONAL_ACCOUNTS }}
          CONSOLE_INTERNAL_TOKEN: ${{ secrets.CONSOLE_INTERNAL_TOKEN }}
          LAB_FEEDBACK_TOKEN: ${{ secrets.LAB_FEEDBACK_TOKEN }}
          # 이메일(SMTP) — 미설정 시 빈 문자열. 아래에서 비어있지 않을 때만 시크릿에 추가한다.
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # 국제처 파일럿 LLM 키 — 비어 있으면 키 자체를 만들지 않는다(Preflight 가 허용한 저하 운영).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 메일 키는 값이 있을 때만 추가 — 빈 문자열 키를 만들면 spring.mail.host="" 가
          # "설정됨"으로 오판되어 SMTP 어댑터가 빈 호스트로 활성화되는 함정을 막는다.
          MAIL_ARGS=()
          [ -n "${SPRING_MAIL_HOST}" ] && MAIL_ARGS+=(--from-literal=SPRING_MAIL_HOST="${SPRING_MAIL_HOST}")
          [ -n "${MAIL_USERNAME}" ]    && MAIL_ARGS+=(--from-literal=MAIL_USERNAME="${MAIL_USERNAME}")
          [ -n "${MAIL_PASSWORD}" ]    && MAIL_ARGS+=(--from-literal=MAIL_PASSWORD="${MAIL_PASSWORD}")
          [ -n "${MAIL_FROM}" ]        && MAIL_ARGS+=(--from-literal=MAIL_FROM="${MAIL_FROM}")
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            MAIL_ARGS+=(--from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}")
          fi

          sudo kubectl create secret generic ovlo-secret \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=REDIS_PASSWORD="${REDIS_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
            --from-literal=CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS}" \
            --from-literal=ADMIN_EMAIL="${ADMIN_EMAIL}" \
            --from-literal=ADMIN_PASSWORD_BCRYPT="${ADMIN_PASSWORD_BCRYPT}" \
            --from-literal=ADMIN_ADDITIONAL_ACCOUNTS="${ADMIN_ADDITIONAL_ACCOUNTS}" \
            --from-literal=CONSOLE_INTERNAL_TOKEN="${CONSOLE_INTERNAL_TOKEN}" \
            --from-literal=LAB_FEEDBACK_TOKEN="${LAB_FEEDBACK_TOKEN}" \
            "${MAIL_ARGS[@]}" \
            -n ovlo --dry-run=client -o yaml | sudo kubectl apply -f -

      - name: Pull and deploy images
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          FRONTEND_IMAGE_TAG: ${{ needs.build-and-push-frontend.outputs.image-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVLO_OFFICE_ALLOW_DEGRADED: ${{ vars.OVLO_OFFICE_ALLOW_DEGRADED }}
        run: |
          set -euo pipefail

          # ── Backend ─────────────────────────────────────────────────────────
          sudo k3s ctr images pull \
            --user "yeonjae1220:${GH_TOKEN}" \
            ghcr.io/yeonjae1220/ovlo:${IMAGE_TAG}

          # Render the source Deployment with its exact tag and explicit operator mode.
          # PVC/Service documents are excluded; runtime env, probes and lifecycle
          # are applied together so image-only updates cannot preserve stale probes.
          BACKEND_MANIFEST="${RUNNER_TEMP}/backend.json"
          sudo kubectl create --dry-run=client --validate=false -f k8s/app.yaml -o json \
            | python3 scripts/render_backend_deployment.py --tag "${IMAGE_TAG}" \
                --allow-degraded "${OVLO_OFFICE_ALLOW_DEGRADED:-false}" > "${BACKEND_MANIFEST}"
          rc=0
          sudo kubectl diff -f "${BACKEND_MANIFEST}" || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          sudo kubectl apply -f "${BACKEND_MANIFEST}"

          sudo kubectl rollout status deployment/app \
            -n ovlo --timeout=300s

          # ── Frontend ────────────────────────────────────────────────────────
          sudo k3s ctr images pull \
            --user "yeonjae1220:${GH_TOKEN}" \
            ghcr.io/yeonjae1220/ovlo-frontend:${FRONTEND_IMAGE_TAG}

          # frontend 는 k8s/frontend.yaml 이 정본이다. set image 만 하면 매니페스트의 env·probe·
          # resources 가 라이브에 영영 닿지 않는다(GLOBAL-PIT-036) — 2026-09-25 까지 라이브가 최초
          # 매니페스트의 64Mi 로 OOMKill 을 반복했다. 이미지 줄만 이번 빌드 태그로 바꿔 한 번에
          # apply 한다(롤아웃 1회). apply 와 set image 로 나누면 중간 롤아웃이 노드에 없는 :latest 를
          # imagePullPolicy: Never 로 찾다가 ErrImageNeverPull 로 멈춘다.
          FRONTEND_IMAGE="ghcr.io/yeonjae1220/ovlo-frontend:${FRONTEND_IMAGE_TAG}"
          FRONTEND_MANIFEST="${RUNNER_TEMP}/frontend.yaml"
          sed "s#image: ghcr.io/yeonjae1220/ovlo-frontend:latest\$#image: ${FRONTEND_IMAGE}#" \
            k8s/frontend.yaml > "${FRONTEND_MANIFEST}"
          if [ "$(grep -c "image: ${FRONTEND_IMAGE}\$" "${FRONTEND_MANIFEST}")" != 1 ]; then
            echo "::error::k8s/frontend.yaml 의 이미지 줄을 ${FRONTEND_IMAGE} 로 치환하지 못했다"
            exit 1
          fi

          # 이번 배포가 매니페스트로 무엇을 바꾸는지 로그에 남긴다. 이미지 태그가 바뀌므로 diff 는
          # 거의 항상 1(차이 있음)이 정상이고, 2 이상만 오류다.
          rc=0
          sudo kubectl diff -f "${FRONTEND_MANIFEST}" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::kubectl diff 실패 (rc=${rc})"
            exit 1
          fi
          sudo kubectl apply -f "${FRONTEND_MANIFEST}"

          sudo kubectl rollout status deployment/frontend \
            -n ovlo --timeout=300s

      - name: Verify internal HTTP health probes
        run: |
          sudo kubectl exec -n ovlo deployment/frontend -- node -e '
            (async () => {
              for (const group of ["liveness", "readiness"]) {
                const response = await fetch("http://app:8080/actuator/health/" + group,
                  { signal: AbortSignal.timeout(5000) });
                const body = await response.json();
                if (response.status !== 200 || body.status !== "UP" || body.components || body.details)
                  throw new Error(group + " probe failed or exposed details");
                console.log(group + ": 200 UP (status only)");
              }
              const metrics = await fetch("http://app:8080/actuator/metrics",
                { signal: AbortSignal.timeout(5000) });
              if (metrics.status !== 401) throw new Error("Metrics auth boundary changed");
            })().catch(error => { console.error(error.message); process.exit(1); });'

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Backend:  ghcr.io/yeonjae1220/ovlo:${{ needs.build-and-push.outputs.image-tag }}"
            echo "✅ Frontend: ghcr.io/yeonjae1220/ovlo-frontend:${{ needs.build-and-push-frontend.outputs.image-tag }}"
          else
            echo "❌ Deploy failed. Review docs/deployment-health.md before rollback."
            echo "Restore a compatible image AND Deployment probe/lifecycle configuration; an image-only rollback can fail health checks."
            echo "Inspect candidate revisions: sudo kubectl rollout history deployment/app -n ovlo"
            echo "Inspect candidate revisions: sudo kubectl rollout history deployment/frontend -n ovlo"
          fi
