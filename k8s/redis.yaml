apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ovlo-redis-pvc
  namespace: ovlo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# 🔴 이 워크로드는 라이브에서 **StatefulSet** 으로 돌고 있다 (레포엔 Deployment 로만
#    적혀 있었다). 그 상태로 `kubectl apply -f` 하면 StatefulSet 은 그대로 둔 채
#    **같은 RWO PVC 를 마운트하는 Deployment 가 하나 더 생긴다** — 같은 데이터
#    디렉터리를 두 프로세스가 붙잡는다. 어느 CI 도 이 파일을 apply 하지 않아 지금까지
#    안 터졌을 뿐, 수동 apply 한 번이면 걸린다 (GLOBAL-PIT-083).
#    StatefulSet 은 replicas:1 에서 구 파드를 완전히 내린 뒤 새 파드를 만들므로
#    GLOBAL-PIT-095(RWO + RollingUpdate 영구 정체)가 구조적으로 성립하지 않는다.
#    2026-09-07 라이브에서 회수 — `kubectl diff` 차이 0줄로 검증했다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ovlo
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: redis
  serviceName: redis-headless
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - command:
        - redis-server
        - --appendonly
        - 'yes'
        - --maxmemory
        - 128mb
        - --maxmemory-policy
        - allkeys-lru
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - containerPort: 6379
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 192Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: redis-data
      dnsPolicy: ClusterFirst
      nodeSelector:
        project2: ovlo
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: ovlo-redis-pvc
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ovlo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# StatefulSet 의 serviceName 이 가리키는 headless Service.
# 이것이 없으면 StatefulSet 파드의 안정적 DNS(<pod>.<svc>)가 성립하지 않는다.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis
  name: redis-headless
  namespace: ovlo
spec:
  clusterIP: None
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
